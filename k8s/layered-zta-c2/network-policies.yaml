# ==============================================================================
# C2 Layered Zero Trust: L3/L4 Kubernetes Network Policies (Defense-in-Depth)
# Enforces transport-layer segmentation to prevent raw TCP socket bypasses
# ==============================================================================

---
# 1. Default Deny Ingress across sock-shop namespace
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: sock-shop
spec:
  podSelector: {}
  policyTypes:
  - Ingress

---
# 2. Allow Ingress to front-end (Edge Tier)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-frontend
  namespace: sock-shop
spec:
  podSelector:
    matchLabels:
      name: front-end
  policyTypes:
  - Ingress
  ingress:
  - ports:
    - protocol: TCP
      port: 80
    - protocol: TCP
      port: 8079
    - protocol: TCP
      port: 15006
    - protocol: TCP
      port: 15021
    - protocol: TCP
      port: 15090

---
# 3. Allow Ingress to catalogue
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-catalogue
  namespace: sock-shop
spec:
  podSelector:
    matchLabels:
      name: catalogue
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          name: front-end
    ports:
    - protocol: TCP
      port: 80
  - ports:
    - protocol: TCP
      port: 15021
    - protocol: TCP
      port: 15090

---
# 4. Allow Ingress to catalogue-db (MySQL 3306) ONLY from catalogue
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-catalogue-db
  namespace: sock-shop
spec:
  podSelector:
    matchLabels:
      name: catalogue-db
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          name: catalogue
    ports:
    - protocol: TCP
      port: 3306
  - ports:
    - protocol: TCP
      port: 15021
    - protocol: TCP
      port: 15090

---
