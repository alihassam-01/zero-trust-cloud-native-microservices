apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: default-deny-all
  namespace: sock-shop
  labels:
    app.kubernetes.io/managed-by: zero-trust-policy-synthesizer
spec:
  # Empty spec denies all ingress traffic by default in Istio
  {}
---
apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: allow-frontend-edge-ingress
  namespace: sock-shop
  labels:
    app.kubernetes.io/managed-by: zero-trust-policy-synthesizer
spec:
  selector:
    matchLabels:
      name: front-end
  action: ALLOW
  rules:
  - to:
    - operation:
        ports: ["8079", "80"]
---
apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: allow-to-carts
  namespace: sock-shop
  labels:
    app.kubernetes.io/managed-by: zero-trust-policy-synthesizer
spec:
  selector:
    matchLabels:
      name: carts
  action: ALLOW
  rules:
  - from:
    - source:
        principals: ["spiffe://cluster.local/ns/sock-shop/sa/front-end"]
    to:
    - operation:
        methods: ["GET"]
        paths: ["/cart"]
        ports: ["80"]
  - from:
    - source:
        principals: ["spiffe://cluster.local/ns/sock-shop/sa/front-end"]
    to:
    - operation:
        methods: ["POST"]
        paths: ["/cart"]
        ports: ["80"]
  - from:
    - source:
        principals: ["spiffe://cluster.local/ns/sock-shop/sa/front-end"]
    to:
    - operation:
        methods: ["DELETE"]
        paths: ["/cart/item/*"]
        ports: ["80"]
---
apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: allow-to-carts-db
  namespace: sock-shop
  labels:
    app.kubernetes.io/managed-by: zero-trust-policy-synthesizer
spec:
  selector:
    matchLabels:
      name: carts-db
  action: ALLOW
  rules:
  - from:
    - source:
        principals: ["spiffe://cluster.local/ns/sock-shop/sa/carts"]
    to:
    - operation:
        ports: ["27017"]
---
